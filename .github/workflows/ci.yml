name: CI
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  codecheck:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run codecheck
        run: make codecheck

  check-unit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run check-unit
        run: make check-unit
