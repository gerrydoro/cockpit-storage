name: CI
on:
  pull_request:
    branches: [main]
  # Also trigger on push to cockpit-ci-container-* branches so the weekly
  # tasks-container-update workflow's push reliably runs CI. The PR trigger
  # alone can be skipped (action_required, zero jobs) due to a race between
  # the bot's push and PR creation.
  push:
    branches:
      - 'cockpit-ci-container-*'

permissions:
  contents: read

concurrency:
  # Cancel in-progress runs for the same branch so push+PR triggers don't
  # run duplicate CI.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  codecheck:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Fix git ownership
        run: git config --global --add safe.directory /__w/cockpit-storage/cockpit-storage

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run codecheck
        run: make codecheck

  check-unit:
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/cockpit-project/tasks
      options: --user root
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Run check-unit
        run: make check-unit